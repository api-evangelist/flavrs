name: Flavrs
description: >-
  Flavrs is a consumer food and cooking platform "made for people who live to
  eat" that pairs short-form cooking videos from notable chefs and food creators
  (including Eric Ripert and Binging with Babish) with structured recipe data and
  integrated ingredient shopping, so viewers can watch a dish being made and buy
  everything they need to cook it in a single app. Backed by a16z and surfaced in
  the API Evangelist network as a portfolio-lead company profile, Flavrs has since
  merged with the meal-delivery service CookUnity and now redirects its audience
  there. Flavrs operates as a mobile consumer application and publishes no public
  developer API, SDK, or documentation surface at this time; this profile captures
  its real identity, legal, and social properties for network completeness.
